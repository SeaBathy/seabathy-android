# XcodeGen spec: `xcodegen generate` turns this into SeaBathy.xcodeproj.
# The .xcodeproj itself is not kept in git; CI generates it on every build.
name: SeaBathy
options:
  bundleIdPrefix: com.seabathy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MapLibre:
    # MapLibre Native for iOS (same engine as SeaBathy for Android).
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SeaBathy:
    type: application
    platform: iOS
    sources:
      - SeaBathy
    dependencies:
      - package: MapLibre
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seabathy.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SeaBathy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
