name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools (Xcode 26 or newer)
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26+ on this runner"; ls /Applications; exit 1; fi
          sudo xcode-select -s "$XCODE"
          brew install xcodegen
          xcodebuild -version
          mkdir -p out logs

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SeaBathy.xcodeproj -scheme SeaBathy -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee logs/device-build.log | tail -n 60

      - name: Package an unsigned .ipa
        run: |
          APP=build/device/Build/Products/Release-iphoneos/SeaBathy.app
          ls "$APP" "$APP/Frameworks"
          mkdir -p pkg/Payload
          cp -R "$APP" pkg/Payload/
          (cd pkg && zip -qry ../out/SeaBathy-unsigned.ipa Payload)
          ls -l out

      - name: Build for the iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project SeaBathy.xcodeproj -scheme SeaBathy -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            build 2>&1 | tee logs/sim-build.log | tail -n 30

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          xcodebuild -project SeaBathy.xcodeproj -scheme SeaBathy -destination "id=$UDID"             -derivedDataPath build/test test 2>&1 | tee logs/tests.log | grep -E "Test Case|error:|Executed|TEST" | tail -n 120

      - name: Run in the simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/SeaBathy.app

          xcrun simctl launch "$UDID" com.seabathy.app
          sleep 40
          xcrun simctl io "$UDID" screenshot out/screenshot-world.png
          xcrun simctl terminate "$UDID" com.seabathy.app

          # Sydney Harbour, to show coastline detail in the dark basemap.
          xcrun simctl launch "$UDID" com.seabathy.app --camera=-33.85,151.25,11
          sleep 40
          xcrun simctl io "$UDID" screenshot out/screenshot-harbour.png

          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "SeaBathy"' > logs/sim-app.log || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q com.seabathy.app; then
            echo "App still running after 40 s: OK"
          else
            echo "::error::SeaBathy is not running (crashed?)"; exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seabathy-ios-build
          path: |
            out/
            logs/
          if-no-files-found: warn
